# dsh-ollama plugin — bundle patch: insert the Ollama adapter row.
#
# Uses Ollama's native /api/chat protocol with NDJSON streaming,
# native thinking/reasoning fields, and native tool calling.
# The row id below is also the settings namespace: the configuration served in
# the GUI is the set of volatile Config fields declared in lib/config.js, so
# edits land live in this row instead of in a separate settings document.
- insert:
    - id: llm-ollama
      name: 'dsh-ollama'
      config:
        baseURL: 'http://127.0.0.1:11434'
